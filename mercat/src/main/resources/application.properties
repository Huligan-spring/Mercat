#Nombre de la aplicación
spring.application.name=mercat

# URL JDBC del Session Pooler de Supabase (IPv4)
spring.datasource.url=${SPRING_DATASOURCE_URL:}

# Credenciales de Supabase
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Driver de conexión para PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# Forzar la plataforma para PostgreSQL de forma correcta
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Puerto dinámico asignado por Render para internet
server.port=${PORT:8080}

# Hibernate creará las tablas automáticamente en la nube al arrancar
spring.jpa.hibernate.ddl-auto=update

# Mostrar las consultas en la consola de Render
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true